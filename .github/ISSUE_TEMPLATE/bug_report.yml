name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Do not file it here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A seeder, the config and the command you ran. Remove credentials.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: pg-seedbed, Node.js, PostgreSQL, pg, NestJS (if used)
    validations:
      required: true
