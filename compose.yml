# Local Postgres for integration tests: `docker compose up -d --wait db`
# then `DATABASE_URL=postgres://postgres:postgres@localhost:55432/seedbed_test pnpm test:integration`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seedbed_test
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d seedbed_test']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: ['/var/lib/postgresql/data']
